name: Build

on:
  workflow_dispatch:
  push:
    branches: ['**']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # fetch-runner-binaries.mjs authenticates its GitHub API lookups with it —
    # unauthenticated requests share the runner IP's 60/h rate limit.
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        node-version: [ 22.x ]
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: guard clean version
        run: node -p "const v=require('./package.json').version; if (/-local|-build/.test(v)) { console.error('stamped version in the repo: ' + v + ' — stamp-version.mjs must not be committed'); process.exit(1) }"
      - name: init Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-${{ runner.os }}-${{ matrix.node-version }}-
      - name: cache vscode-test electron
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: vscode-test-${{ runner.os }}-
      - name: static checks and coverage
        run: |
          npm install
          npm run check-types
          npm run coverage
      - name: tests and package
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
          xvfb-run -a npm run build
          xvfb-run -a npm run package
      - name: upload coverage artifact
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14
      - name: upload vsix artifact
        uses: actions/upload-artifact@v5
        with:
          name: vsix
          path: '*.vsix'
          retention-days: 14
