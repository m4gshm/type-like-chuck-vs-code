name: Handle Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  generate:
    name: create release-artifacts
    # Prereleases (e.g. the rolling vsix pre-release) already carry their vsix and must
    # not reach the marketplaces.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: guard tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          node -e "const t=process.env.TAG.replace(/^v/,''); const v=require('./package.json').version; if (t!==v) { console.error('release tag '+process.env.TAG+' does not match package.json version '+v+' - bump the version before publishing'); process.exit(1) }"
      - name: init Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-${{ runner.os }}-${{ matrix.node-version }}-
      - name: cache vscode-test electron
        uses: actions/cache@v4
        with:
          path: .vscode-test
          key: vscode-test-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: vscode-test-${{ runner.os }}-
      - name: tests and package
        run: |
          command -v xvfb-run >/dev/null || { sudo apt-get update && sudo apt-get install -y xvfb; }
          xvfb-run -a npm install
          xvfb-run -a npm run build
          xvfb-run -a npm run package
      - name: publish to VS Code Marketplace
        run: |
          set -o pipefail
          npx vsce publish --no-dependencies --packagePath *.vsix 2>&1 | tee vsce.log || { grep -q "already exists" vsce.log && echo "version already published, skipping" || exit 1; }
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: publish to Open VSX Registry
        run: |
          set -o pipefail
          # ovsx words a same-version republish "already published" (vsce says
          # "already exists"); "isn't active" means the version is stuck
          # invisible on the registry and must fail loudly.
          npx ovsx publish --packagePath *.vsix -p "$OPEN_VSX_TOKEN" 2>&1 | tee ovsx.log \
            || { grep -q "isn't active" ovsx.log \
                   && { echo "version published but inactive on the registry"; exit 1; } \
                   || { grep -qE "already exists|already published" ovsx.log && echo "version already published, skipping" || exit 1; }; }
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      - name: upload the artifacts
        run: gh release upload "${GITHUB_REF_NAME}" --clobber *.vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
