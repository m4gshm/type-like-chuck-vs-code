name: Handle Release
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  generate:
    name: create release-artifacts
    # Prereleases (e.g. the rolling vsix pre-release) already carry their vsix and must
    # not reach the marketplaces.
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    strategy:
      matrix:
        node-version: [22.x]
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: init Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: tests and package
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run -a npm install
          xvfb-run -a npm run build
          xvfb-run -a npm run package
      - name: publish to VS Code Marketplace
        run: |
          set -o pipefail
          npx vsce publish --no-dependencies --packagePath *.vsix 2>&1 | tee vsce.log || { grep -q "already exists" vsce.log && echo "version already published, skipping" || exit 1; }
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: publish to Open VSX Registry
        run: |
          set -o pipefail
          npx ovsx publish --packagePath *.vsix -p "$OPEN_VSX_TOKEN" 2>&1 | tee ovsx.log || { grep -q "already exists" ovsx.log && echo "version already published, skipping" || exit 1; }
        env:
          OPEN_VSX_TOKEN: ${{ secrets.OPEN_VSX_TOKEN }}
      - name: upload the artifacts
        run: gh release upload "${GITHUB_REF_NAME}" --clobber *.vsix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
