name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@v5
      # A pushed tag publishes immediately: refuse when it is not on main,
      # so experimental branches cannot ship releases by accident.
      - name: verify the tag is on main
        run: |
          git fetch -q origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || {
            echo "::error::tag ${GITHUB_REF_NAME} is not on main — release refused; tag the merge commit on main instead"
            exit 1
          }
      - name: guard tag matches package.json version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          node -e "const t=process.env.TAG.replace(/^v/,''); const v=require('./package.json').version; if (t!==v) { console.error('tag '+process.env.TAG+' does not match package.json version '+v+' - move the tag onto the version-bump commit'); process.exit(1) }"
      - name: init Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
          cache: npm
      - name: cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('package-lock.json') }}
          restore-keys: node-modules-${{ runner.os }}-node22-
      - name: guard clean version
        run: |
          node -e "const v=require('./package.json').version; if (/-local|-build/.test(v)) { console.error('stamped version in the repo: ' + v + ' - stamp-version.mjs must not be committed'); process.exit(1) }"
      - name: install dependencies
        run: npm install
      - name: static checks and unit tests
        run: |
          npm run check-types
          npm run unit
          npm run lint
      - name: fetch runner binaries from the backend repo release
        run: node scripts/fetch-runner-binaries.mjs
      - name: verify mlx runner resources landed
        run: |
          # Without mlx.metallib the mlx runner exits 255 at model load; no
          # linux step can launch the Mach-O to find out, so check the files
          # the runtime requires instead.
          for f in binaries/mlx/darwin-arm64/tlc-mlx-runner \
                   binaries/mlx/darwin-arm64/mlx.metallib; do
            test -f "$f" || { echo "missing mlx runner file: $f"; exit 1; }
          done
      # A dev-stamped runner (built from a feature branch, `runner:import`
      # before the backend was tagged) must never ship: the sidecar written by
      # runner:import/runner:fetch has to be a clean release tag.
      - name: guard release-stamped runners
        run: |
          status=0
          for tagfile in binaries/*/*/*.tag; do
            tag=$(cat "$tagfile")
            if ! echo "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
              echo "::error::$tagfile carries a non-release version: $tag — tag the backend release and re-import (task runner:import) or fetch (task runner:fetch)"
              status=1
            fi
          done
          exit $status
          echo "mlx runner resources present"
      - name: verify runner binaries launch
        run: |
          code=0
          ./binaries/ovgenai/linux-x64/tlc-ovgenai-runner 2>/dev/null || code=$?
          # 2 = usage/loader error from the runner; 127 = the ELF is valid but its
          # shared OpenVINO libs are absent on a bare host — the extension supplies
          # LD_LIBRARY_PATH itself. Anything else is a broken asset.
          test "$code" -eq 2 -o "$code" -eq 127 || { echo "runner exited with $code, expected 2 or 127"; exit 1; }
          echo "runner starts (exit $code)"
      - name: pack vsix
        run: |
          npm run compile
          node scripts/make-icon.mjs
          npx vsce package --no-dependencies
      - name: verify binaries inside the packed vsix
        run: |
          vsix=$(ls *.vsix)
          unzip -oq "$vsix" -d vsix-check
          find vsix-check -type f | sort
          for f in binaries/ovgenai/linux-x64/tlc-ovgenai-runner \
                   binaries/ovgenai/win32-x64/tlc-ovgenai-runner.exe \
                   binaries/ovgenai/linux-arm64/tlc-ovgenai-runner \
                   binaries/mlx/darwin-arm64/tlc-mlx-runner \
                   binaries/mlx/darwin-arm64/mlx.metallib; do
            test -f "vsix-check/extension/$f" || { echo "missing in vsix: $f"; exit 1; }
          done
          echo "exec bit: $(stat -c '%a' vsix-check/extension/binaries/ovgenai/linux-x64/tlc-ovgenai-runner)"
          echo "installed-layout launch check:"
          code=0
          ./vsix-check/extension/binaries/ovgenai/linux-x64/tlc-ovgenai-runner 2>/dev/null || code=$?
          if [ "$code" -eq 2 ] || [ "$code" -eq 127 ]; then
            echo "runner from vsix starts (exit $code)"
          else
            echo "runner from vsix exited with $code"; exit 1
          fi
      - name: upload vsix artifact
        uses: actions/upload-artifact@v5
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: tlc-vsix
          path: '*.vsix'
          retention-days: 30
      - name: create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
