name: Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: read

jobs:
  package:
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: checkout
        uses: actions/checkout@v5
      - name: init Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22.x
      - name: install dependencies
        run: npm install
      - name: static checks and unit tests
        run: |
          npm run check-types
          npm run unit
          npm run lint
      - name: fetch runner binaries from the backend repo release
        run: node scripts/fetch-runner-binaries.mjs
      - name: verify mlx runner resources landed
        run: |
          # Without mlx.metallib the mlx runner exits 255 at model load; no
          # linux step can launch the Mach-O to find out, so check the files
          # the runtime requires instead.
          for f in binaries/mlx/darwin-arm64/tlc-mlx-runner \
                   binaries/mlx/darwin-arm64/mlx.metallib; do
            test -f "$f" || { echo "missing mlx runner file: $f"; exit 1; }
          done
          echo "mlx runner resources present"
      - name: verify runner binaries launch
        run: |
          code=0
          ./binaries/ovgenai/linux-x64/tlc-ovgenai-runner 2>/dev/null || code=$?
          # 2 = usage/loader error from the runner; 127 = the ELF is valid but its
          # shared OpenVINO libs are absent on a bare host — the extension supplies
          # LD_LIBRARY_PATH itself. Anything else is a broken asset.
          test "$code" -eq 2 -o "$code" -eq 127 || { echo "runner exited with $code, expected 2 or 127"; exit 1; }
          echo "runner starts (exit $code)"
      - name: pack vsix
        run: |
          npm run compile
          node scripts/make-icon.mjs
          npx vsce package --no-dependencies
      - name: verify binaries inside the packed vsix
        run: |
          vsix=$(ls *.vsix)
          unzip -oq "$vsix" -d vsix-check
          find vsix-check -type f | sort
          for f in binaries/ovgenai/linux-x64/tlc-ovgenai-runner \
                   binaries/ovgenai/win32-x64/tlc-ovgenai-runner.exe \
                   binaries/ovgenai/linux-arm64/tlc-ovgenai-runner \
                   binaries/mlx/darwin-arm64/tlc-mlx-runner \
                   binaries/mlx/darwin-arm64/mlx.metallib; do
            test -f "vsix-check/extension/$f" || { echo "missing in vsix: $f"; exit 1; }
          done
          echo "exec bit: $(stat -c '%a' vsix-check/extension/binaries/ovgenai/linux-x64/tlc-ovgenai-runner)"
          echo "installed-layout launch check:"
          code=0
          ./vsix-check/extension/binaries/ovgenai/linux-x64/tlc-ovgenai-runner 2>/dev/null || code=$?
          if [ "$code" -eq 2 ] || [ "$code" -eq 127 ]; then
            echo "runner from vsix starts (exit $code)"
          else
            echo "runner from vsix exited with $code"; exit 1
          fi
      - name: upload vsix artifact
        uses: actions/upload-artifact@v5
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: tlc-vsix
          path: '*.vsix'
          retention-days: 30
      - name: create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: '*.vsix'
          generate_release_notes: true
